name: Update profile art

# Heatmap roz refresh hota hai. Info card bhi isi run mein banta hai kyunki
# usme live repo/language counts aate hain.
on:
  schedule:
    - cron: "17 6 * * *"        # roz ~06:17 UTC (11:47 IST)
  workflow_dispatch:            # Actions tab se manually bhi chala sakte ho
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/update-profile-art.yml"

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Fetch contributions
        env:
          GH_USER: ${{ github.repository_owner }}
        run: python scripts/fetch_contributions.py

      - name: Render heatmap
        run: python scripts/render_heatmap_svg.py

      - name: Render info card
        env:
          GH_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/make_info_card.py

      # [skip ci] zaroori hai — warna commit khud workflow ko dobara trigger kar deta hai
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile art [skip ci]"
          file_pattern: "contrib-heatmap.svg info-card.svg data/contributions.json"
